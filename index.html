<script>
  document.addEventListener("DOMContentLoaded", function() {
    var h1 = document.querySelector("#title-bar h1");
    if (h1) {
      var spans = h1.querySelectorAll("span");
      spans.forEach(function(s) {
        if (s.textContent.includes("GOD'S EYE")) s.textContent = "SENTINEL";
        if (s.textContent === "VIEW") s.textContent = "";
      });
    }
    var sub = document.querySelector("#title-bar .subtitle");
    if (sub && sub.textContent === "NO PLACE LEFT BEHIND") {
      sub.textContent = "Osint Multi-Sector Intelligence · TLP:AMBER · L3";
    }
  });
</script><!-- SENTINEL PRESETS -->
<script>
(function () {
  var READY = false;
  var PRESETS = [
    { id: "ENVIRONMENTAL", label: "ENVIRONMENTAL", icon: "🌍", layers: ["Earthquakes", "FIRMS", "Live Flights"] },
    { id: "MOBILITY", label: "MOBILITY", icon: "🚗", layers: ["Live Flights", "Live AIS Vessels", "Street Traffic"] },
    { id: "ORBITAL", label: "ORBITAL", icon: "🛰", layers: ["Earthquakes", "Live Flights", "Satellites"] },
    { id: "GROUND TRUTH", label: "GROUND TRUTH", icon: "📡", layers: ["FIRMS", "Street Traffic", "CCTV"] }
  ];
  function findBtn(name) {
    var bs = document.querySelectorAll("button");
    for (var i = 0; i < bs.length; i++) {
      if ((bs[i].textContent || "").indexOf(name) !== -1) return bs[i];
    }
    return null;
  }
  function isOn(name) {
    var b = findBtn(name);
    if (!b) return false;
    return (b.textContent || "").indexOf(": ON") !== -1;
  }
  function setLayer(name, want) {
    var b = findBtn(name);
    if (!b) return;
    var on = isOn(name);
    if (want && !on) b.click();
    else if (!want && on) b.click();
  }
  function applyPreset(id) {
    var p = PRESETS.find(function (x) { return x.id === id; });
    if (!p) return;
    var all = {};
    PRESETS.forEach(function (x) { x.layers.forEach(function (l) { all[l] = true; }); });
    Object.keys(all).forEach(function (l) { setLayer(l, false); });
    setTimeout(function () {
      p.layers.forEach(function (l, i) {
        setTimeout(function () { setLayer(l, true); }, i * 250);
      });
    }, 400);
    document.querySelectorAll(".sentinel-preset").forEach(function (e) {
      e.classList.toggle("sentinel-preset-active", e.dataset.preset === id);
    });
  }
  function inject() {
    if (READY) return;
    if (document.querySelector(".sentinel-presets-floating")) { READY = true; return; }
    var bar = document.createElement("div");
    bar.className = "sentinel-presets-floating";
    bar.style.cssText = "position:fixed;bottom:225px;left:12px;z-index:9999;display:flex;flex-direction:column;gap:4px;padding:8px;border:1px solid rgba(255,176,0,0.35);background:rgba(10,11,14,0.92);backdrop-filter:blur(8px);box-shadow:0 4px 24px rgba(0,0,0,0.6),0 0 16px rgba(255,176,0,0.15);font-family:'JetBrains Mono',monospace;max-width:220px;";
    var h = document.createElement("div");
    h.style.cssText = "font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:rgba(252,211,77,0.9);text-align:center;padding:2px 0 4px 0;border-bottom:1px solid rgba(255,176,0,0.2);margin-bottom:4px;";
    h.textContent = "▸ SENTINEL PRESETS";
    bar.appendChild(h);
    var g = document.createElement("div");
    g.style.cssText = "display:grid;grid-template-columns:1fr 1fr;gap:3px;";
    PRESETS.forEach(function (p) {
      var b = document.createElement("button");
      b.className = "sentinel-preset";
      b.dataset.preset = p.id;
      b.style.cssText = "display:flex;align-items:center;justify-content:center;gap:3px;padding:6px 4px;border:1px solid rgba(255,176,0,0.3);background:rgba(255,176,0,0.05);color:rgba(252,211,77,0.9);font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;transition:all 0.15s ease;";
      b.innerHTML = '<span style="font-size:12px">' + p.icon + '</span><span>' + p.label + '</span>';
      b.title = p.layers.join(" + ");
      b.addEventListener("click", function () { applyPreset(p.id); });
      b.addEventListener("mouseenter", function () {
        if (!b.classList.contains("sentinel-preset-active")) {
          b.style.background = "rgba(255,176,0,0.15)";
          b.style.borderColor = "rgba(255,176,0,0.6)";
        }
      });
      b.addEventListener("mouseleave", function () {
        if (!b.classList.contains("sentinel-preset-active")) {
          b.style.background = "rgba(255,176,0,0.05)";
          b.style.borderColor = "rgba(255,176,0,0.3)";
        }
      });
      g.appendChild(b);
    });
    bar.appendChild(g);
    var hint = document.createElement("div");
    hint.style.cssText = "font-size:7px;letter-spacing:0.1em;text-transform:uppercase;color:rgba(252,211,77,0.4);text-align:center;padding:4px 0 0 0;border-top:1px solid rgba(255,176,0,0.15);margin-top:4px;";
    hint.textContent = "1 CLICK = 3 LAYERS";
    bar.appendChild(hint);
    document.body.appendChild(bar);
    READY = true;
  }
  if (document.readyState !== "loading") { setTimeout(inject, 500); }
  else document.addEventListener("DOMContentLoaded", function () { setTimeout(inject, 500); });
  var att = 0;
  var ii = setInterval(function () { att++; inject(); if (READY || att > 60) clearInterval(ii); }, 500);
})();
</script>
<!-- end --><!-- SENTINEL BRAND CLEANUP -->
<script>
(function () {
  var fav = document.querySelector("link[rel='icon']");
  if (fav) fav.href = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230a0b0e'/><text x='16' y='23' text-anchor='middle' font-size='22' fill='%23ffb000' font-family='monospace' font-weight='bold'>S</text></svg>";

  var css = document.createElement('style');
  css.textContent = '#title-bar img,.title-logo,.brand-logo,.title-glow img,img[src*="logo.svg"],img[src*="logo.png"],.hud-loading img,.loader-logo,.loader-brand{display:none!important;visibility:hidden!important;width:0!important;height:0!important}.title-glow{background:none!important}';
  document.head.appendChild(css);

  function clean() {
    var w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);
    var n;
    while ((n = w.nextNode())) {
      var v = n.nodeValue;
      if (/god'?s?\s*eye\s*view/i.test(v)) n.nodeValue = v.replace(/god'?s?\s*eye\s*view/gi, "SENTINEL");
      if (/god'?s?\s*eye/i.test(n.nodeValue)) n.nodeValue = n.nodeValue.replace(/god'?s?\s*eye/gi, "SENTINEL");
      if (/\bGEV\b/i.test(n.nodeValue)) n.nodeValue = n.nodeValue.replace(/\bGEV\b/g, "SENTINEL");
      if (/initializing.*world/i.test(n.nodeValue)) n.nodeValue = "Initializing SENTINEL globe...";
      if (/photorealistic/i.test(n.nodeValue)) n.nodeValue = n.nodeValue.replace(/photorealistic/gi, "SENTINEL");
      if (/no place left behind/i.test(n.nodeValue)) n.nodeValue = "Osint Multi-Sector Intelligence";
      if (/SENTINEL\s*View/i.test(n.nodeValue)) n.nodeValue = n.nodeValue.replace(/SENTINEL\s*View/i, "SENTINEL");
      if (n.nodeValue.trim() === "View" || n.nodeValue.trim() === "VIEW") n.nodeValue = "";
    }
    document.querySelectorAll('[alt]').forEach(function(el) {
      if (el.alt && /god|eye|gev/i.test(el.alt)) el.alt = 'SENTINEL';
    });
  }

  clean();
  document.addEventListener('DOMContentLoaded', clean);
  var obs = new MutationObserver(function () { clean(); });
  if (document.body) obs.observe(document.body, { childList: true, subtree: true, characterData: true });
  setTimeout(function () { obs.disconnect(); }, 30000);
})();
</script>
</body>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    var h1 = document.querySelector("#title-bar h1");
    if (h1) {
      var spans = h1.querySelectorAll("span");
      spans.forEach(function(s) {
        if (s.textContent.includes("GOD'S EYE")) s.textContent = "SENTINEL";
        if (s.textContent === "VIEW") s.textContent = "";
      });
    }
    var sub = document.querySelector("#title-bar .subtitle");
    if (sub && sub.textContent === "NO PLACE LEFT BEHIND") {
      sub.textContent = "Osint Multi-Sector Intelligence · TLP:AMBER · L3";
    }
  });
</script>
</script>
<!-- end --><!-- SENTINEL BRAND CLEANUP -->
<script>
(function () {
  var fav = document.querySelector("link[rel='icon']");
  if (fav) fav.href = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230a0b0e'/><text x='16' y='23' text-anchor='middle' font-size='22' fill='%23ffb000' font-family='monospace' font-weight='bold'>S</text></svg>";

  var css = document.createElement('style');
  css.textContent = '#title-bar img,.title-logo,.brand-logo,.title-glow img,img[src*="logo.svg"],img[src*="logo.png"],.hud-loading img,.loader-logo,.loader-brand{display:none!important;visibility:hidden!important;width:0!important;height:0!important}.title-glow{background:none!important}';
  document.head.appendChild(css);

  function clean() {
    var w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);
    var n;
    while ((n = w.nextNode())) {
      var v = n.nodeValue;
      if (/god'?s?\s*eye\s*view/i.test(v)) n.nodeValue = v.replace(/god'?s?\s*eye\s*view/gi, "SENTINEL");
      if (/god'?s?\s*eye/i.test(n.nodeValue)) n.nodeValue = n.nodeValue.replace(/god'?s?\s*eye/gi, "SENTINEL");
      if (/\bGEV\b/i.test(n.nodeValue)) n.nodeValue = n.nodeValue.replace(/\bGEV\b/g, "SENTINEL");
      if (/initializing.*world/i.test(n.nodeValue)) n.nodeValue = "Initializing SENTINEL globe...";
      if (/photorealistic/i.test(n.nodeValue)) n.nodeValue = n.nodeValue.replace(/photorealistic/gi, "SENTINEL");
      if (/no place left behind/i.test(n.nodeValue)) n.nodeValue = "Osint Multi-Sector Intelligence";
      if (/SENTINEL\s*View/i.test(n.nodeValue)) n.nodeValue = n.nodeValue.replace(/SENTINEL\s*View/i, "SENTINEL");
      if (n.nodeValue.trim() === "View" || n.nodeValue.trim() === "VIEW") n.nodeValue = "";
    }
    document.querySelectorAll('[alt]').forEach(function(el) {
      if (el.alt && /god|eye|gev/i.test(el.alt)) el.alt = 'SENTINEL';
    });
  }

  clean();
  document.addEventListener('DOMContentLoaded', clean);
  var obs = new MutationObserver(function () { clean(); });
  if (document.body) obs.observe(document.body, { childList: true, subtree: true, characterData: true });
  setTimeout(function () { obs.disconnect(); }, 30000);
})();
</script>
</body>
</html>
